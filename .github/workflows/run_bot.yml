name: Daily Crypto Scanner

   on:
     schedule:
       # Runs every day at 12:00 PM UTC (Noon)
       - cron: '0 12 * * *'
     workflow_dispatch: # This allows you to run it manually to test

   jobs:
     run-bot:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout code
           uses: actions/checkout@v3
         
         - name: Set up Python
           uses: actions/setup-python@v4
           with:
             python-version: '3.10'
             
         - name: Install dependencies
           run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt
             
         - name: Run the bot
           run: python bot.py
